name: Verify ReaPack package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check files, checksums and first launch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/test-requirements.txt
      - run: python tools/reapack.py check
      - run: python -m unittest discover -s tests -v
      # Publishing and uploading the engine require a separate explicit action.
      # This workflow never changes index.xml, creates tags or publishes releases.
